<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Plan your goals, break them into steps, and organise your days. Works offline; your data stays on your device.">
<title>GoalPlanner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Goals">
<script>
  // Apply the saved theme before anything is drawn so the page never flashes the wrong one
  try {
    const t = localStorage.getItem('goalPlanner.theme.v1');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch {}
</script>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/today">
      <img src="icon.svg" alt="" width="28" height="28">
      <span>GoalPlanner</span>
    </a>
    <button id="syncBadge" class="sync-badge" type="button" hidden></button>
  </header>
  <div class="layout">
    <nav id="sideNav" class="side-nav" aria-label="Main"></nav>
    <main id="main" tabindex="-1">
      <noscript><p class="card">GoalPlanner needs JavaScript turned on.</p></noscript>
    </main>
  </div>
  <button id="fab" class="fab" type="button" aria-label="Add">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <nav id="tabBar" class="tab-bar" aria-label="Main"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
